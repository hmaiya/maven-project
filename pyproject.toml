[project]
name = "customer-data-unifier"
version = "0.1.0"
description = "Integrate and normalize customer data from multiple source systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28.1",
]

[project.scripts]
unify = "unify.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
